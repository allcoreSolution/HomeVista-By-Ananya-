<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HomeVista</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-page">

        <!-- LEFT SIDE -->
        <div class="login-left">
            <div class="left-content">

                <div class="login-logo">
                    <img src="images/logo.png" alt="HomeVista Logo">
                    <span class="home-text">Home</span>
                    <span class="vista-text">Vista</span>
                </div>

                <h1>
                    Your Dream Home
                    <span>Awaits</span>
                </h1>

                <p class="left-description">
                    Discover, explore and find the perfect property
                    that matches your lifestyle.
                </p>

            </div>

            <div class="left-bottom-text">
                <span>Better Homes</span>
                <br>
                <span>Brighter Futures</span>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">
            <div class="login-card">

                <div class="card-logo">
                    <img src="images/logo.png" alt="HomeVista Logo">
                    <span class="home-text">Home</span>
                    <span class="vista-text">Vista</span>
                </div>

                <p class="login-subtitle">
                    Set a new password
                </p>

                <div class="welcome">
                    <h2>Reset Password</h2>
                    <p>
                        Enter the reset code and choose a new password.
                    </p>
                </div>

                <!-- FORM -->
                <form id="resetForm">

                    <div class="input-box">
                        <i class="fa-solid fa-key"></i>
                        <input
                            type="text"
                            id="resetCode"
                            placeholder="Reset code"
                        >
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="New password (min 6 characters)"
                        >
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                        >
                    </div>

                    <button type="submit" class="main-login-btn">
                        <span>Update Password</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

                <p class="signup-text">
                    Back to
                    <a href="login.html">Login</a>
                </p>

            </div>
        </div>

    </div>

    <script src="js/reset-password.js"></script>

</body>

</html>
