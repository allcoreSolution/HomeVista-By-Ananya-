<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - HomeVista</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .article-wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px 60px; }
        .article-back { display: inline-block; margin-bottom: 20px; color: #1261d8; text-decoration: none; font-weight: 600; }
        .article-label { display: inline-block; background: #e8f0fe; color: #1261d8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
        .article-wrap h1 { font-size: 34px; line-height: 1.25; margin: 14px 0 12px; color: #0f2547; }
        .article-meta { display: flex; gap: 20px; color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .article-image { width: 100%; max-height: 420px; object-fit: cover; border-radius: 16px; margin-bottom: 28px; }
        .article-body p { font-size: 17px; line-height: 1.8; color: #334155; margin: 0 0 18px; }
        .article-message { text-align: center; color: #64748b; padding: 60px 0; }
    </style>
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="HomeVista Logo">
            <span class="home-text">Home</span>
            <span class="vista-text">Vista</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="buy.html">Buy</a>
            <a href="rent.html">Rent</a>
            <a href="projects.html">Projects</a>
            <a href="commercial.html">Commercial</a>
            <a href="agents.html">Agents</a>
            <a href="blog.html" class="active">Blog</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main class="article-wrap" id="article">
        <p class="article-message">Loading article...</p>
    </main>

    <footer style="text-align:center; padding:25px; background:#f5f8fc; color:#64748b;">
        <p>
            © 2026 HomeVista. All rights reserved.
            | <a href="blog.html" style="color:#1261d8; text-decoration:none;">Back to Blog</a>
        </p>
    </footer>

    <script src="js/header.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/blog-detail.js"></script>

</body>

</html>
