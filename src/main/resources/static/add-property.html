<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property - HomeVista</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f3f6fb; color: #172b4d; }
        .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px rgba(20, 40, 80, 0.08); }
        h1 { margin: 0 0 6px; font-size: 26px; }
        p.sub { margin: 0 0 22px; color: #64748b; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d5dde8; border-radius: 10px; font-size: 14px; }
        textarea { min-height: 90px; resize: vertical; }
        button { margin-top: 18px; width: 100%; padding: 14px; background: #1261d8; color: #fff; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        #msg { margin-top: 14px; font-weight: 600; }
        .ok { color: #137333; }
        .bad { color: #c5221f; }
        a.back { display: inline-block; margin-bottom: 14px; color: #1261d8; text-decoration: none; font-weight: 600; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="back" href="index.html">&larr; Back to HomeVista</a>

        <div class="card">
            <h1>Add Property</h1>
            <p class="sub">Only for site admin. The admin key is required.</p>

            <form id="propertyForm">
                <div class="grid">

                    <div class="full">
                        <label for="adminKey">Admin key</label>
                        <input type="password" id="adminKey" autocomplete="off">
                    </div>

                    <div class="full">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="3 BHK Apartment">
                    </div>

                    <div>
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="Gomti Nagar, Lucknow">
                    </div>

                    <div>
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="buy">Buy</option>
                            <option value="rent">Rent</option>
                            <option value="commercial">Commercial</option>
                        </select>
                    </div>

                    <div>
                        <label for="price">Price (₹, rent = per month)</label>
                        <input type="number" id="price" min="0" placeholder="8500000">
                    </div>

                    <div>
                        <label for="imageUrl">Image URL</label>
                        <input type="text" id="imageUrl" placeholder="https://...">
                    </div>
                                        <div>
                        <label for="propertyType">Property type</label>
                        <select id="propertyType">
                            <option value="apartment">Apartment</option>
                            <option value="villa">Villa</option>
                            <option value="house">House</option>
                            <option value="plot">Plot</option>
                            <option value="office">Office</option>
                            <option value="shop">Shop</option>
                        </select>
                    </div>

                    <div>
                        <label for="featured">Show on home page?</label>
                        <select id="featured">
                            <option value="no">No</option>
                            <option value="yes">Yes (featured)</option>
                        </select>
                    </div>

                    <div>
                        <label for="bhk">BHK / Type</label>
                        <input type="text" id="bhk" placeholder="3 BHK">
                    </div>

                    <div>
                        <label for="bath">Baths</label>
                        <input type="text" id="bath" placeholder="3 Baths">
                    </div>

                    <div>
                        <label for="area">Area (sq.ft)</label>
                        <input type="text" id="area" placeholder="1,450">
                    </div>

                    <div>
                        <label for="furnished">Furnishing</label>
                        <input type="text" id="furnished" placeholder="Furnished">
                    </div>

                    <div class="full">
                        <label for="description">Description</label>
                        <textarea id="description"></textarea>
                    </div>

                </div>

                <button type="submit">Add Property</button>
                <div id="msg"></div>
            </form>
        </div>
    </div>

    <script src="js/add-property.js"></script>
</body>

</html>
