<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - HomeVista</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: #f3f6fb; color: #172b4d; }
        .wrap { max-width: 1100px; margin: 30px auto; padding: 0 16px; }
        h1 { margin: 0 0 6px; }
        h2 { margin: 30px 0 12px; font-size: 20px; }
        .sub { color: #64748b; margin: 0 0 18px; }
        .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 6px 24px rgba(20, 40, 80, 0.07); }
        .keybar { display: flex; gap: 10px; flex-wrap: wrap; }
        .keybar input { flex: 1; min-width: 220px; padding: 12px; border: 1px solid #d5dde8; border-radius: 10px; font-size: 14px; }
        button { padding: 11px 18px; background: #1261d8; color: #fff; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
        button.danger { background: #c5221f; padding: 7px 12px; font-size: 13px; }
        #status { margin-top: 12px; font-weight: 600; }
        .ok { color: #137333; }
        .bad { color: #c5221f; }
        .table-box { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e6ebf2; vertical-align: top; }
        th { color: #64748b; font-size: 12px; text-transform: uppercase; }
        .links a { color: #1261d8; text-decoration: none; font-weight: 600; margin-right: 16px; }
        .empty { color: #64748b; text-align: center; padding: 20px; }
    </style>
</head>

<body>
    <div class="wrap">

        <h1>HomeVista Admin</h1>
        <p class="sub">Enter the admin key to manage properties and see enquiries.</p>

        <div class="links" style="margin-bottom:16px;">
            <a href="add-property.html">+ Add property</a>
            <a href="index.html">&larr; Back to site</a>
        </div>

        <div class="card">
            <div class="keybar">
                <input type="password" id="adminKey" placeholder="Admin key" autocomplete="off">
                <button type="button" id="loadBtn">Load</button>
            </div>
            <div id="status"></div>
        </div>

        <h2>Properties</h2>
        <div class="card table-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Price</th>
                        <th>Featured</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="propsBody">
                    <tr><td colspan="6" class="empty">Enter the admin key and press Load.</td></tr>
                </tbody>
            </table>
        </div>

        <h2>Enquiries</h2>
        <div class="card table-box">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Property</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="inqBody">
                    <tr><td colspan="5" class="empty">Enter the admin key and press Load.</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="js/admin.js"></script>
</body>

</html>
