# ================= Server =================
# Render par PORT env variable milta hai (default 10000). Local par 8080.
server.port=${PORT:8080}

# Local machine ke secrets (gitignore kiya hua). Render par ye file nahi hogi,
# wahan values environment variables se aayengi.
spring.config.import=optional:file:./local.properties

# Render ke proxy ke peeche https/session sahi kaam kare
server.forward-headers-strategy=framework

# ================= Database =================
# Local : MariaDB (neeche wala default)
# Render: bas ek env variable SET karo -> SPRING_DATASOURCE_URL = Render ka Internal DSN
#         (jis me user + password pehle se included hote hain, isliye yahan
#          username/password define nahi kiya)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/homevista?createDatabaseIfNotExist=true}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ================= Session / cookie =================
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ================= Mail (Gmail) =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_APP_PASSWORD:}

# ================= App config =================
# Password reset email ke link ka domain
homevista.base-url=${BASE_URL:http://localhost:8080}

# Admin panel login (local.properties > env > khali)
homevista.admin-username=${ADMIN_USERNAME:}
homevista.admin-password=${ADMIN_PASSWORD:}
